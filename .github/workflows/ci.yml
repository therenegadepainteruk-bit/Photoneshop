name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format check, type check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Package size report
        run: |
          SIZE_BYTES=$(stat -c%s dist/photoneshop.zip)
          SIZE_KB=$(awk "BEGIN { printf \"%.1f\", $SIZE_BYTES / 1024 }")
          echo "photoneshop.zip: ${SIZE_KB} KB (${SIZE_BYTES} bytes)"
          echo "### Package size" >> "$GITHUB_STEP_SUMMARY"
          echo "\`dist/photoneshop.zip\`: **${SIZE_KB} KB** (${SIZE_BYTES} bytes)" >> "$GITHUB_STEP_SUMMARY"
